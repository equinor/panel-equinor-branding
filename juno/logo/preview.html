<!doctype html>
<html><head><meta charset="utf-8"><title>Juno mark preview</title>
<style>
  body{margin:0;font:14px system-ui;display:grid;grid-template-columns:1fr 1fr;gap:0}
  .cell{padding:32px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .light{background:#f8f8f8;color:#262628}
  .dark{background:#262628;color:#f8f8f8}
  .card{background:#fff;border:1px solid #b7b7bb;border-radius:12px;padding:28px 36px;display:flex;flex-direction:column;align-items:center;gap:14px;width:300px}
  .dark .card{background:#1e1e21;border-color:#3a3a3f}
  .btn{background:#9547c0;color:#fff;border-radius:8px;padding:10px 0;width:100%;text-align:center;font-weight:600}
  h3{margin:8px 0 0;font-weight:600;opacity:.7}
  img,svg,object{display:block}
  object{color:inherit}
  .row{display:flex;gap:24px;align-items:flex-end}
  .tab{display:flex;align-items:center;gap:8px;background:#e6e6e8;border-radius:8px 8px 0 0;padding:6px 12px;font-size:12px}
  .dark .tab{background:#3a3a3f}
  details{width:100%;opacity:.85}
</style></head>
<body>
  <div class="cell light">
    <h3>lockup v3 (settled)</h3>
    <object data="juno-lockup-v3.svg" type="image/svg+xml" width="390" style="color:#262628"></object>
    <h3>o-mark v3 (settled)</h3>
    <div class="row">
      <img src="juno-o-mark-v3-light.svg" width="160">
      <img src="juno-o-mark-v3-light.svg" width="64">
      <img src="juno-o-mark-v3-light.svg" width="32">
      <img src="juno-o-mark-v3-light.svg" width="16">
    </div>
    <div class="tab"><img src="juno-o-mark-v3-light.svg" width="16">Juno — Sign in</div>
    <div class="card">
      <img src="juno-o-mark-v3-light.svg" width="96">
      <div style="font-weight:600">Sign in to Juno</div>
      <div class="btn">Equinor</div>
    </div>
    <details><summary>archive</summary>
      <h3>lockup v2 · v1</h3>
      <object data="archive/juno-lockup-v2.svg" type="image/svg+xml" width="300" style="color:#262628"></object>
      <object data="archive/juno-lockup-v1.svg" type="image/svg+xml" width="300" style="color:#262628"></object>
      <h3>o-mark v2 · v1 · fan</h3>
      <div class="row"><img src="archive/juno-o-mark-v2-light.svg" width="110"><img src="archive/juno-o-mark-light.svg" width="110"><img src="archive/juno-mark-light.svg" width="130"></div>
    </details>
  </div>
  <div class="cell dark">
    <h3>lockup v3 (settled)</h3>
    <object data="juno-lockup-v3.svg" type="image/svg+xml" width="390" style="color:#f8f8f8"></object>
    <h3>o-mark v3 (settled)</h3>
    <div class="row">
      <img src="juno-o-mark-v3-dark.svg" width="160">
      <img src="juno-o-mark-v3-dark.svg" width="64">
      <img src="juno-o-mark-v3-dark.svg" width="32">
      <img src="juno-o-mark-v3-dark.svg" width="16">
    </div>
    <div class="tab"><img src="juno-o-mark-v3-dark.svg" width="16">Juno — Sign in</div>
    <div class="card">
      <img src="juno-o-mark-v3-dark.svg" width="96">
      <div style="font-weight:600">Sign in to Juno</div>
      <div class="btn">Equinor</div>
    </div>
    <details><summary>archive</summary>
      <h3>lockup v2 · v1</h3>
      <object data="archive/juno-lockup-v2.svg" type="image/svg+xml" width="300" style="color:#f8f8f8"></object>
      <object data="archive/juno-lockup-v1.svg" type="image/svg+xml" width="300" style="color:#f8f8f8"></object>
      <h3>o-mark v2 · v1 · fan</h3>
      <div class="row"><img src="archive/juno-o-mark-v2-dark.svg" width="110"><img src="archive/juno-o-mark-dark.svg" width="110"><img src="archive/juno-mark-dark.svg" width="130"></div>
    </details>
  </div>
</body></html>
